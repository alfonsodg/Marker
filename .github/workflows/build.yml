name: Build

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y meson ninja-build \
            libgtk-3-dev libgtksourceview-4-dev \
            libwebkit2gtk-4.1-dev libgtkspell3-3-dev \
            itstool gettext

      - name: Build
        run: |
          meson setup builddir
          ninja -C builddir

      # The test binary calls marker_prefs_load, which needs the GSettings
      # schema registered, and the renderer reads the stylesheet from the
      # install prefix. Install before testing.
      - name: Install
        run: sudo ninja -C builddir install

      - name: Test
        run: meson test -C builddir --print-errorlogs
