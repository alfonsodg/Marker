app-id: com.github.fabiocolacio.marker
runtime: org.gnome.Platform
runtime-version: '46'
sdk: org.gnome.Sdk
command: marker
finish-args:
  - --share=ipc
  - --socket=fallback-x11
  - --socket=wayland
  - --filesystem=home
modules:
  - name: gtkspell3
    buildsystem: autotools
    sources:
      - type: archive
        url: https://sourceforge.net/projects/gtkspell/files/3.0.10/gtkspell3-3.0.10.tar.xz
        sha256: b040f63836b347eb344f5571e2a7c5c28da0a3e7a3e97c8df1740d2806a3e7f0

  - name: gtksourceview4
    buildsystem: meson
    sources:
      - type: archive
        url: https://download.gnome.org/sources/gtksourceview/4.8/gtksourceview-4.8.4.tar.xz
        sha256: 7ec9d18fb283d1f84a3a3eff3b7a72b09a10c9c006597b3fbabbb5958420a87d

  - name: marker
    buildsystem: meson
    sources:
      - type: git
        url: https://github.com/alfonsodg/Marker.git
        branch: master
      - type: git
        url: https://github.com/Mandarancio/scidown.git
        dest: src/scidown
      - type: git
        url: https://github.com/Mandarancio/charter.git
        dest: src/scidown/src/charter
      - type: git
        url: https://github.com/codeplea/tinyexpr.git
        dest: src/scidown/src/charter/src/tinyexpr
